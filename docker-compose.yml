services:
  wordpress:
    build: .
    container_name: wp_app
    restart: always
    ports:
      - "8095:80"
    environment:
      # Nama server untuk Caddy/FrankenPHP (menonaktifkan auto HTTPS untuk lokal)
      SERVER_NAME: ":80"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"

    volumes:
      - .:/app
      - ./Caddyfile:/etc/caddy/Caddyfile

    networks:
      - wp_net

  adminer:
    image: adminer:latest
    container_name: wp_adminer
    restart: always
    ports:
      - "8083:8080"
    networks:
      - wp_net

networks:
  wp_net:
    driver: bridge
